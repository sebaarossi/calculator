openapi: 3.0.3
info:
  title: Calculator API
  version: 1.0.0
  description: |
    Arithmetic operations over JSON, with an append-only history of every
    calculation performed. The history is kept in memory and is lost when the
    service restarts.

    **Decimal arithmetic.** Calculations use exact decimal arithmetic, not binary
    floating point: `0.1 + 0.2` is exactly `0.3`. Results are rounded to 34
    significant digits (IEEE 754 decimal128) using half-even rounding. Numbers
    are sent and returned as strings.

    Malformed requests return **400**. Well-formed requests that have no valid
    mathematical answer (for example dividing by zero) return **422**. Every
    error has the same shape, with a stable machine-readable `code`.
servers:
  - url: /
paths:
  /api/v1/calculations:
    post:
      summary: Perform a calculation and record it
      description: Failed calculations are not recorded.
      operationId: createCalculation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculationRequest'
            examples:
              add:
                summary: Addition
                value: { operation: add, a: '2', b: '3' }
              exact:
                summary: Exact decimals (0.1 + 0.2 = 0.3)
                value: { operation: add, a: '0.1', b: '0.2' }
              divide:
                summary: Division
                value: { operation: divide, a: '9', b: '2' }
              power:
                summary: Exponentiation
                value: { operation: power, a: '2', b: '10' }
              sqrt:
                summary: Square root (unary, no b)
                value: { operation: sqrt, a: '81' }
              percentage:
                summary: 20 percent of 150
                value: { operation: percentage, a: '20', b: '150' }
              divisionByZero:
                summary: Division by zero (returns 422)
                value: { operation: divide, a: '1', b: '0' }
      responses:
        '201':
          description: The recorded calculation
          headers:
            Location:
              description: URL of the new calculation
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calculation'
              example:
                { id: 1, operation: add, a: '2', b: '3', result: '5', createdAt: '2026-10-05T21:30:00Z' }
        '400':
          description: >-
            The request is malformed: invalid JSON, a missing, duplicated or
            unknown field, an operand that is not a decimal string, a `b` on a
            unary operation, or an unknown operation
            (`invalid_request`, `unknown_operation`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: invalid_request, message: 'field "b" is required for operation "add"' }
        '413':
          description: The request body is larger than 1 KB (`request_too_large`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: '`Content-Type` is not `application/json` (`unsupported_media_type`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            The calculation has no valid result (`division_by_zero`,
            `negative_square_root`, `undefined_result`, `result_out_of_range`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: division_by_zero, message: division by zero }
    get:
      summary: List the calculation history, newest first
      operationId: listCalculations
      parameters:
        - name: limit
          in: query
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: The `nextCursor` of the previous page. Omit for the first page.
          schema:
            type: string
      responses:
        '200':
          description: One page of the history
          content:
            application/json:
              schema:
                type: object
                required: [calculations]
                properties:
                  calculations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Calculation'
                  nextCursor:
                    type: string
                    description: Present only when there are older calculations to fetch.
        '400':
          description: '`limit` or `cursor` is not valid (`invalid_request`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/calculations/{id}:
    get:
      summary: Get one recorded calculation
      operationId: getCalculation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The calculation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calculation'
        '404':
          description: No calculation has that ID (`not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/payment-plans:
    post:
      summary: Split a purchase into interest-free installments
      description: |
        Models "buy now, pay later" plans: the first installment is charged at
        checkout and the rest follow every 14 days, with no interest.

        The installments always add up to exactly the amount. When it does not
        divide evenly, the leftover cents go on the first installment, so the
        payments still to come are all equal. Nothing is stored.
      operationId: createPaymentPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentPlanRequest'
            examples:
              payIn4:
                summary: Pay in 4
                value: { plan: pay_in_4, amount: '99.99', purchaseDate: '2026-10-05' }
              payIn2:
                summary: Pay in 2
                value: { plan: pay_in_2, amount: '50', purchaseDate: '2026-10-05' }
              payIn5:
                summary: Pay in 5
                value: { plan: pay_in_5, amount: '250.00', purchaseDate: '2026-10-05' }
      responses:
        '200':
          description: The payment schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPlan'
        '400':
          description: >-
            The request is malformed: a missing field, an amount that is not
            dollars with at most two decimals, a date that is not `YYYY-MM-DD`
            (`invalid_request`), or an unknown plan (`unknown_plan`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: '`Content-Type` is not `application/json` (`unsupported_media_type`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            The amount cannot be split: it has fewer cents than the plan has
            installments, or it exceeds 1,000,000.00 (`amount_out_of_range`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/operations:
    get:
      summary: List the supported operations
      operationId: listOperations
      responses:
        '200':
          description: The supported operations
          content:
            application/json:
              schema:
                type: object
                required: [operations]
                properties:
                  operations:
                    type: array
                    items:
                      $ref: '#/components/schemas/OperationInfo'
  /healthz:
    get:
      summary: Health check
      operationId: health
      responses:
        '200':
          description: The service is up
          content:
            application/json:
              example: { status: ok }
components:
  schemas:
    Operation:
      type: string
      enum: [add, subtract, multiply, divide, power, sqrt, percentage]
    Decimal:
      type: string
      description: >-
        A decimal number sent as a string, such as "12.5", "-0.01" or "1.5E+3",
        with at most 34 significant digits. Strings are used instead of JSON
        numbers so that no client parses a value as binary floating point.
      example: '12.5'
    CalculationRequest:
      type: object
      required: [operation, a]
      additionalProperties: false
      properties:
        operation:
          $ref: '#/components/schemas/Operation'
        a:
          $ref: '#/components/schemas/Decimal'
        b:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: >-
            Second operand. Required for every operation except `sqrt`, which
            takes one operand and rejects a `b`.
    Calculation:
      type: object
      required: [id, operation, a, result, createdAt]
      properties:
        id:
          type: integer
        operation:
          $ref: '#/components/schemas/Operation'
        a:
          $ref: '#/components/schemas/Decimal'
        b:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          description: Omitted for unary operations.
        result:
          $ref: '#/components/schemas/Decimal'
        createdAt:
          type: string
          format: date-time
    Money:
      type: string
      description: An amount in US dollars, as a string with at most two decimals. Responses always use two.
      example: '99.99'
    PaymentPlanRequest:
      type: object
      required: [plan, amount, purchaseDate]
      additionalProperties: false
      properties:
        plan:
          type: string
          enum: [pay_in_2, pay_in_4, pay_in_5]
        amount:
          $ref: '#/components/schemas/Money'
        purchaseDate:
          type: string
          format: date
          description: The day of the purchase, when the first installment is charged.
    PaymentPlan:
      type: object
      required: [plan, amount, currency, interest, intervalDays, installments]
      properties:
        plan:
          type: string
          enum: [pay_in_2, pay_in_4, pay_in_5]
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          example: USD
        interest:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Always 0.00; these plans are interest-free.
        intervalDays:
          type: integer
          example: 14
        installments:
          type: array
          items:
            type: object
            required: [number, dueDate, amount]
            properties:
              number:
                type: integer
                description: 1 is the installment charged at checkout.
              dueDate:
                type: string
                format: date
              amount:
                $ref: '#/components/schemas/Money'
    OperationInfo:
      type: object
      required: [name, operands, description]
      properties:
        name:
          $ref: '#/components/schemas/Operation'
        operands:
          type: integer
          description: How many operands the operation takes (1 or 2).
        description:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, machine-readable identifier.
            message:
              type: string
              description: Human-readable explanation; may change.
